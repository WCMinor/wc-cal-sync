# wc-cal-sync configuration
# Copy this to config.yaml and fill in your credentials.

calendars:
  # Google Calendar (OAuth2)
  - id: "personal-google"
    provider: "google"
    calendar_id: "primary"
    google_client_id: "${GOOGLE_CLIENT_ID}"
    google_client_secret: "${GOOGLE_CLIENT_SECRET}"
    token_file: "tokens/google-personal.json"

  # Microsoft Outlook (OAuth2 via Azure AD)
  - id: "work-outlook"
    provider: "outlook"
    calendar_id: "" # leave empty for default calendar, or use calendar ID
    tenant_id: "common" # or your Azure AD tenant ID
    client_id: "${OUTLOOK_CLIENT_ID}"
    client_secret: "${OUTLOOK_CLIENT_SECRET}"
    token_file: "tokens/outlook-work.json"

  # Another Outlook calendar (different Microsoft account)
  # - id: "work2-outlook"
  #   provider: "outlook"
  #   calendar_id: ""
  #   tenant_id: "common"
  #   client_id: "${OUTLOOK2_CLIENT_ID}"
  #   client_secret: "${OUTLOOK2_CLIENT_SECRET}"
  #   token_file: "tokens/outlook-work2.json"

  # Apple iCloud Calendar (app-specific password, no OAuth)
  - id: "apple-personal"
    provider: "apple"
    server: "https://caldav.icloud.com"
    username: "your-apple-id@icloud.com"
    password_env: "APPLE_APP_PASSWORD"
    calendar_path: "/1234567890/calendars/your-calendar-id/"

# Merged calendar — shows all real events in one place
# This will be an Apple Calendar where all events are mirrored with full details.
merged_calendar:
  provider: "apple"
  server: "https://caldav.icloud.com"
  username: "your-apple-id@icloud.com"
  password_env: "APPLE_APP_PASSWORD"
  calendar_path: "/1234567890/calendars/merged-view/"

sync:
  interval_minutes: 5
  lookahead_days: 30
  lookback_days: 7
  blocker_title: "Busy"

oauth:
  callback_port: 8089
  callback_host: "localhost"

state_file: "/data/sync-state.json"
